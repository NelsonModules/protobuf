syntax = "proto3";

package nelson.test.any;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

// Invented test schema: Any fields packing a message and a well-known type.
message Point {
  int32 x = 1;
  int32 y = 2;
}

message Holder {
  google.protobuf.Any item = 1;
  repeated google.protobuf.Any items = 2;
  string note = 3;
}
